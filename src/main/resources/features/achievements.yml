# ─── Достижения Wasteland Artifacts ───
# Типы: ARTIFACTS_FOUND, ARTIFACTS_CRAFTED, ARTIFACTS_UPGRADED,
#        DUNGEONS_CLEARED, ELITE_KILLS, BOSS_KILLS,
#        COLLECTION_PROGRESS, FISHING_CAUGHT, XP_LEVELS
# Награды: COMMAND:say %player% молодец, ITEM:artifact_id, MESSAGE:lang.key

achievements:
