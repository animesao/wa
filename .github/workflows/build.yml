name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew shadowJar

      - name: Extract version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep "^version\s*=" build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        run: git log --oneline -10 --no-decorate > changelog.txt

      - name: Build release notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          {
            echo "## $TAG"
            echo ""
            echo "### Что изменилось (последние 10 коммитов):"
            echo '```'
            cat changelog.txt
            echo '```'
          } > release-notes.md

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WastelandArtifacts
          path: build/libs/*.jar

      - name: List build output
        run: ls -la build/libs/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          JAR="build/libs/WastelandArtifacts-${{ steps.version.outputs.version }}.jar"

          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --repo ${{ github.repository }}
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --latest \
              --repo ${{ github.repository }}
          fi

          if [ -f "$JAR" ]; then
            echo "Uploading $JAR..."
            gh release upload "$TAG" "$JAR" --clobber --repo ${{ github.repository }}
          else
            echo "JAR not found: $JAR"
            ls -la build/libs/ || true
          fi
