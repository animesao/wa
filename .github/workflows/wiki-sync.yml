name: Wiki Sync

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ github.token }}
          path: wiki

      - name: Sync docs to wiki
        run: |
          rm -rf wiki/*
          cp -r main/docs/*.md wiki/
          if [ -f wiki/WIKI_EN.md ]; then
            mv wiki/WIKI_EN.md wiki/Home.md
          fi
          if [ -f wiki/WIKI_RU.md ]; then
            mv wiki/WIKI_RU.md wiki/Russian.md
          fi

      - name: Commit and push
        run: |
          cd wiki
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Sync wiki from docs/ (${{ github.sha }})"
            git push
          else
            echo "No changes to sync"
          fi
