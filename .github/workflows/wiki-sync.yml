name: Wiki Sync

on:
  push:
    branches: [ main ]
    paths: [ 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Clone wiki repo
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::WIKI_TOKEN secret not set. Create a PAT at https://github.com/settings/tokens and add it as WIKI_TOKEN secret."
            exit 1
          fi
          git clone https://x-access-token:$TOKEN@github.com/${{ github.repository }}.wiki.git wiki
          git config --global user.name "wiki-sync[bot]"
          git config --global user.email "wiki-sync[bot]@users.noreply.github.com"

      - name: Sync docs to wiki
        run: |
          rm -rf wiki/*
          cp -r main/docs/*.md wiki/
          if [ -f wiki/WIKI_EN.md ]; then
            mv wiki/WIKI_EN.md wiki/Home.md
          fi
          if [ -f wiki/WIKI_RU.md ]; then
            mv wiki/WIKI_RU.md wiki/Russian.md
          fi

      - name: Commit and push
        run: |
          cd wiki
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Sync wiki from docs/ (${{ github.sha }})"
            git push
          else
            echo "No changes to sync"
          fi
